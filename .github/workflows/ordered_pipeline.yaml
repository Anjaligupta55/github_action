name: Ordered Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Print setup complete
        run: echo "Setup done"

  verify:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print runtime version
        run: node --version

      - name: Print verify complete
        run: echo "Verify done"

  finish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Print pipeline complete
        run: echo "Pipeline finished"
