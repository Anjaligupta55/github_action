name: checkout proof

on:
  push:
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest

    steps:
      - name: current folder name
        run: |
          pwd
          ls -la

      - name: checkout repository
        uses: actions/checkout@v4

      - name: List contents after checkout
        run: ls -la

      - name: count present files
        run: ls -1 | wc -l

      - name: complete proof
        run: echo "proof captured"
