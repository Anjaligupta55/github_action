name: using actions

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: install dependencies
        run: npm ci

      - name: run tests
        run: npm run test
